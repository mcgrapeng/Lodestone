name: render-docs

on:
  push:
    branches: [master, main, refactor/**]
    paths:
      - 'README.md'
      - '安装说明.md'
      - '使用手册.md'
      - 'docs/logo.svg'
      - 'docs/screenshots/**'
      - 'scripts/render_preview.py'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install mistune
        run: pip install mistune
      - name: Render preview HTML
        run: python3 scripts/render_preview.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/preview/index.html
          if git diff --cached --quiet; then
            echo "No doc changes to commit"
          else
            git commit -m "docs: auto-render preview from ${{ github.sha }}"
            git push
          fi
