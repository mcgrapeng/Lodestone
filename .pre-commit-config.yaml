# Pre-commit hooks for lodestone.
#
# Setup (one time):
#   pip install pre-commit
#   pre-commit install
#
# Run on all files (e.g. in CI or before pushing):
#   pre-commit run --all-files
#
# Update hook versions:
#   pre-commit autoupdate
#
# Skip a hook for a single commit:
#   git commit --no-verify

# Minimum pre-commit version — pre-commit-hooks v5 + ruff both need >=3.5.
minimum_pre_commit_version: "3.5.0"

repos:
  # ---------------------------------------------------------------------------
  # Standard hygiene: syntax / format / merge-conflict / large-file checks.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        # .pre-commit-config.yaml itself is YAML — exclude so editing it doesn't
        # fail when there are duplicate keys from copy-paste.
        exclude: ^\.pre-commit-config\.yaml$
      - id: check-toml
      - id: check-json
        # npm's lockfile is machine-generated and huge; let it through.
        exclude: ^frontend/package-lock\.json$
      - id: check-merge-conflict
      - id: check-case-conflict
        # macOS dev -> Linux CI: same name, different case is a real bug.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key
        # Catch leaked SSH / PEM keys.
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]

  # ---------------------------------------------------------------------------
  # Ruff: lint + format. Already the project linter (.ruff_cache/ exists),
  # so this just gates commits on a clean tree.
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.8
    hooks:
      - id: ruff
        args: ["--fix"]
        types_or: [python, pyi]
        # Only lint the Python tree, not the Vue app.
        files: ^(radar\.py|db/|scrapers/|tests/)
      - id: ruff-format
        types_or: [python, pyi]
        files: ^(radar\.py|db/|scrapers/|tests/)

  # ---------------------------------------------------------------------------
  # Repo-local safety: refuse to commit .env (which carries PG creds).
  # .env.example is the committed template — allow it.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: no-env-leak
        name: block committing .env (may contain PG creds)
        entry: bash -c 'git diff --cached --name-only --diff-filter=A | grep -qx "\.env" && { echo "Refusing to commit .env (use .env.example instead)." >&2; exit 1; } || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-commit]
