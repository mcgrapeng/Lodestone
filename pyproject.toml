[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lodestone*"]

[project]
name = "lodestone"
version = "2.0.0a1"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.29",
    "pg8000>=1.30",
    "croniter>=2.0",
]

[project.entry-points."lodestone.sources"]
github       = "lodestone.plugins.github:GitHubSource"
huggingface  = "lodestone.plugins.huggingface:HuggingFaceSource"
mcp_registry = "lodestone.plugins.mcp_registry:MCPRegistrySource"
arxiv        = "lodestone.plugins.arxiv:ArxivSource"

[project.entry-points."lodestone.scorers"]
recency = "lodestone.plugins.scorer_recency:RecencyScorer"
stars   = "lodestone.plugins.scorer_stars:StarsScorer"

[project.entry-points."lodestone.notifiers"]
in_app  = "lodestone.plugins.notifier_inapp:InappNotifier"
webhook = "lodestone.plugins.notifier_webhook:WebhookNotifier"
